<div class="card-header">
  <i class="bi bi-envelope-check me-2"></i>Verify Email
</div>
<div class="card-body text-center py-4">

  <div *ngIf="emailStatus == EmailStatus.Verifying">
    <div class="mb-3">
      <div class="spinner-border text-primary" role="status" style="width:2.5rem;height:2.5rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <h5 style="color:#2d3748;font-weight:600;">Verifying your email...</h5>
    <p style="color:#718096;font-size:0.9rem;">Please wait while we confirm your account.</p>
  </div>

  <div *ngIf="emailStatus == EmailStatus.Failed">
    <div class="mb-3">
      <div style="width:60px;height:60px;background:#fff5f5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;">
        <i class="bi bi-x-circle-fill" style="font-size:1.8rem;color:#e53e3e;"></i>
      </div>
    </div>
    <h5 style="color:#2d3748;font-weight:600;">Verification Failed</h5>
    <p style="color:#718096;font-size:0.9rem;">
      The verification link is invalid or has expired.
      You can verify your account using the
      <a routerLink="../forgot-password" style="color:#667eea;font-weight:500;">forgot password</a> page.
    </p>
    <a routerLink="../login" class="btn btn-primary mt-2">Back to Sign In</a>
  </div>

</div>
