<div class="card-header">
  <i class="bi bi-box-arrow-in-right me-2"></i>Welcome back
</div>
<div class="card-body">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input type="text" formControlName="email" class="form-control"
        placeholder="you@example.com"
        [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
      <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
        <div *ngIf="f['email'].errors['required']">Email is required</div>
        <div *ngIf="f['email'].errors['email']">Email is invalid</div>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" formControlName="password" class="form-control"
        placeholder="••••••••"
        [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
      <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
        <div *ngIf="f['password'].errors['required']">Password is required</div>
      </div>
    </div>
    <div class="d-grid mb-3">
      <button [disabled]="submitting" class="btn btn-primary">
        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!submitting" class="bi bi-box-arrow-in-right me-2"></i>
        Sign in
      </button>
    </div>
    <div class="d-flex justify-content-between align-items-center">
      <a routerLink="../register" class="btn btn-link ps-0">Create account</a>
      <a routerLink="../forgot-password" class="btn btn-link pe-0">Forgot password?</a>
    </div>
  </form>
</div>
